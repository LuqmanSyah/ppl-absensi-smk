services:
  db:
    image: postgres:17-alpine
    container_name: absensi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-absensi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-absensi}
      POSTGRES_DB: ${POSTGRES_DB:-absensi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-absensi} -d $${POSTGRES_DB:-absensi}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
